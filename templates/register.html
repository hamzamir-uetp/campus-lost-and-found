{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm bg-white">
            <h4 class="mb-3 text-center fw-bold">Create Account</h4>
            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Hamza Mir">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="e.g. user@uetpeshawar.edu.pk">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="STUDENT">Student</option>
                        <option value="CUSTODIAN">Security Desk / Custodian</option>
                        <option value="ADMIN">Campus Administrator</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Already have an account? <a href="/login">Log in here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
