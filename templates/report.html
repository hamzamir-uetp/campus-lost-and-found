{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4 shadow-sm bg-white">
            <h4 class="mb-3 fw-bold">Report Lost or Found Property</h4>
            <form action="/report" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Report Type</label>
                    <select name="report_type" class="form-select" required>
                        <option value="LOST">I Lost an Item</option>
                        <option value="FOUND">I Found an Item</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="Electronics">Electronics (Laptop, Mobile, Charger, USB)</option>
                        <option value="Personal Belongings">Personal Belongings (Bag, Jacket, Bottle)</option>
                        <option value="Documents/Cards">Documents / Campus Cards / Keys</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">General Description (Public)</label>
                    <textarea name="description" class="form-control" rows="3" required placeholder="Describe appearance briefly. Do NOT post serial numbers, student card numbers, or passwords here."></textarea>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Campus Location</label>
                        <input type="text" name="location" class="form-control" placeholder="e.g. Department Lab 2, Library Ground Floor" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Incident Date</label>
                        <input type="date" name="event_date" class="form-control" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Optional Photo (Max 5MB)</label>
                    <input type="file" name="photo" class="form-control" accept="image/png, image/jpeg, image/webp">
                    <small class="text-muted">Accepted formats: PNG, JPG, JPEG, WebP</small>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit Report</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
